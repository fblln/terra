# Infrastructure every stack needs. Public images only, so this file is runnable
# as-is — the point of the demo is that the harness works, not that it is realistic.
#
# Note what is NOT here: fixed host ports. Docker assigns them, systest looks them
# up and writes them into the descriptor. That is what lets two environments coexist.

services:
  mongodb:
    image: mongo:7
    ports:
      - "27017"                      # published on an ephemeral host port
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s

  kafka:
    image: apache/kafka:3.8.0
    # Kafka hands its own address to clients, so it cannot live behind an ephemeral
    # port. KAFKA_HOST_PORT is derived from the environment fingerprint: stable for
    # this environment, different for every other one. See environments/*.yml.
    ports:
      - "${KAFKA_HOST_PORT:-29092}:${KAFKA_HOST_PORT:-29092}"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,HOST://:${KAFKA_HOST_PORT:-29092}
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,HOST://localhost:${KAFKA_HOST_PORT:-29092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s
