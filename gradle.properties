# Caching — and the one thing that must never be cached.
#
# Safe: compilation, jars, resources. They are pure functions of their inputs.
# NOT safe: the systemTest task. Its real input is a live environment that Gradle
# can neither see nor hash, which is why it declares `outputs.upToDateWhen { false }`.
# A cached test result is a test that did not run.

org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true
org.gradle.parallel=true
org.gradle.daemon=true

# systest passes TERRA_ENV / TERRA_TAGS as environment variables, and the build
# reads them at configuration time — which makes each distinct value a *separate*
# configuration cache key. With the default of one entry per key, alternating
# environments evicts on every switch and stores again. Keep one entry per
# environment × tag combination you actually use.
org.gradle.configuration-cache.entries-per-key=8

# The harness talks to Docker and to a network; give the daemon room, not the machine.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m

# Isolated Projects (incubating). Implies the configuration cache, and adds the
# rule that no project may configure another — which is why the root build file is
# empty and shared decisions live in settings.gradle.kts. In exchange Gradle caches
# each project's configuration separately, so editing one build file does not
# re-configure the whole build.
org.gradle.isolated-projects=true

kotlin.incremental=true
